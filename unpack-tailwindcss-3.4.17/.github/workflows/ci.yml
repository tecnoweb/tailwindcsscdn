name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Verify file integrity
      run: |
        cd dist
        sha256sum -c SHA256SUM.txt
        cd unpkg
        sha256sum -c SHA256SUM.txt
    
    - name: Check file sizes
      run: |
        echo "Checking file sizes..."
        ls -lh dist/*.js
        ls -lh dist/unpkg/*.js
